name: decision-ui-visual-qa
# temporary pre-human proof for decision UI prototype

on:
  pull_request:
    paths:
      - "index.html"
      - "offers.html"
      - "decision.html"
      - "decision-ui.css"
      - "decision-ui.js"
      - "decision-data.json"
      - "docs/public-offer-contract-v1.md"
      - "scripts/check_public_offer_contract.py"
      - "scripts/check_site.py"
      - "scripts/check_offer_freshness.py"
      - "scripts/build_cloudflare.py"
      - "sitemap.xml"
      - ".github/workflows/decision-ui-visual-qa.yml"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_site.py
      - run: python3 scripts/check_public_offer_contract.py
      - run: pip install playwright
      - run: python -m playwright install chromium
      - name: Start isolated static preview
        run: |
          python3 -m http.server 4173 > /tmp/decision-ui-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/decision-ui-http.log
          exit 1
      - name: Mechanical QA and screenshots
        run: |
          mkdir -p artifacts/decision-ui
          cat > /tmp/capture_decision.py <<'PY'
          import asyncio
          import json
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT = Path("artifacts/decision-ui")
          URL = "http://127.0.0.1:4173/"
          VIEWPORTS = [(1440, 1100), (390, 844), (375, 812)]

          async def metrics(page, width, stage):
              scroll_w = await page.evaluate("document.documentElement.scrollWidth")
              client_w = await page.evaluate("document.documentElement.clientWidth")
              visible_panel = await page.locator(".decision-stage.is-active").get_attribute("data-panel")
              heading_texts = await page.locator("h1,h2,h3").all_inner_texts()
              return {
                  "viewport": [width, await page.evaluate("window.innerHeight")],
                  "stage": stage,
                  "visible_panel": visible_panel,
                  "scrollWidth": scroll_w,
                  "clientWidth": client_w,
                  "overflow": scroll_w > client_w,
                  "headings": heading_texts,
              }

          async def check_entry_routes(browser):
              cases = [
                  ("", "1", "", ""),
                  ("?destination=kanto&month=2026-10", "2", "kanto", ""),
                  ("?date=2026-10-14", "1", "", "2026-10-14"),
                  ("?destination=kanto&date=2026-10-14", "3", "kanto", "2026-10-14"),
              ]
              results = []
              for query, expected_panel, expected_destination, expected_date in cases:
                  page = await browser.new_page(viewport={"width": 390, "height": 844}, locale="ja-JP", timezone_id="Asia/Tokyo")
                  await page.goto(URL + query, wait_until="networkidle")
                  results.append({
                      "query": query,
                      "expected_panel": expected_panel,
                      "visible_panel": await page.locator(".decision-stage.is-active").get_attribute("data-panel"),
                      "destination": await page.locator("#destination").input_value(),
                      "date": await page.locator("#travel-date").input_value(),
                      "expected_destination": expected_destination,
                      "expected_date": expected_date,
                  })
                  await page.close()
              return results

          async def capture_width(browser, width, height):
              page_errors = []
              console_errors = []
              page = await browser.new_page(viewport={"width": width, "height": height}, locale="ja-JP", timezone_id="Asia/Tokyo")
              page.on("pageerror", lambda exc: page_errors.append(str(exc)))
              page.on("console", lambda msg: console_errors.append(msg.text) if msg.type == "error" else None)

              resp = await page.goto(URL, wait_until="networkidle")
              await page.evaluate("document.fonts.ready")
              font_status = await page.evaluate("document.fonts.status")
              font_checks = await page.evaluate("""async () => {
                await document.fonts.load('16px "Noto Sans JP"', '旅行');
                await document.fonts.load('16px "Inter"', '123');
                return {
                  noto: document.fonts.check('16px "Noto Sans JP"', '旅行'),
                  inter: document.fonts.check('16px "Inter"', '123'),
                  h1Family: getComputedStyle(document.querySelector('#decision-title')).fontFamily,
                  footerFamily: getComputedStyle(document.querySelector('.decision-footer')).fontFamily
                };
              }""")

              title = await page.title()
              h1 = (await page.locator("h1").inner_text()).strip()
              data_notice = (await page.locator(".decision-footer").inner_text()).strip()
              initial_path = OUT / f"decision-home-{width}.png"
              await page.screenshot(path=str(initial_path), full_page=True)
              image_failures = await page.locator(".intro-visual img, .japan-map-visual, .destination-card img").evaluate_all("""els => els.flatMap(el => {
                if (el.complete && el.naturalWidth > 0 && el.naturalHeight > 0) return [];
                return [{src:el.currentSrc || el.src, complete:el.complete, naturalWidth:el.naturalWidth, naturalHeight:el.naturalHeight}];
              })""")
              estimator_contract = await page.evaluate("""() => {
                const f = window.__TOKUERABI_QA__ && window.__TOKUERABI_QA__.estimateDiscountForBenefit;
                if (!f) return {hook:false};
                return {
                  hook: true,
                  capped: f({kind:"coupon_rate",currency:"JPY",calculation_base:"eligible_stay_amount",minimum_spend:10000,rate_percent:20,max_discount_amount:3000,rounding:"floor"}, 20000).label,
                  below: f({kind:"coupon_rate",currency:"JPY",calculation_base:"eligible_stay_amount",minimum_spend:10000,rate_percent:20,max_discount_amount:3000,rounding:"floor"}, 8000).label,
                  fixed: f({kind:"coupon_fixed",currency:"JPY",calculation_base:"eligible_stay_amount",minimum_spend:30000,discount_amount:5000}, 40000).label,
                  badCurrency: f({kind:"coupon_rate",currency:"USD",calculation_base:"eligible_stay_amount",minimum_spend:0,rate_percent:20,max_discount_amount:null,rounding:"floor"}, 20000).label,
                  missingRounding: f({kind:"coupon_rate",currency:"JPY",calculation_base:"eligible_stay_amount",minimum_spend:0,rate_percent:20,max_discount_amount:null}, 20000).label,
                  points: f({kind:"paypay_total_rate",rate_percent:10}, 50000).label
                };
              }""")

              # Form persistence proof: change → reload → preserved.
              await page.locator("#adult-plus").click()
              await page.locator("#travel-month").select_option("2026-11")
              await page.locator('[data-region="kanto"]').click()
              await page.reload(wait_until="networkidle")
              persisted = {
                  "destination": await page.locator("#destination").input_value(),
                  "month": await page.locator("#travel-month").input_value(),
                  "adults": (await page.locator("#adult-count").inner_text()).strip(),
              }

              # Restore deterministic review state through the public URL contract.
              # The redesigned flow intentionally hides global inputs outside Step 1,
              # so visual QA must not depend on clicking hidden controls.
              await page.goto(URL + "?destination=kanto&month=2026-10&adults=2", wait_until="networkidle")
              await page.locator('.step-tab[data-step="1"]').click()
              await page.locator('[data-region="kanto"]').click()

              control = page.locator('[data-region="kanto"]')
              await control.focus()
              await page.keyboard.press("Tab")
              await page.keyboard.press("Shift+Tab")
              focus_visible = await control.evaluate("el => el.matches(':focus-visible')")
              # The previous region click can leave the pointer over the selected control,
              # especially at narrow widths. Move away before sampling the true base state.
              await page.mouse.move(1, 1)
              await page.wait_for_timeout(60)
              base_state = await control.evaluate("""el => {
                const s = getComputedStyle(el);
                return {background:s.backgroundColor, transform:s.transform, boxShadow:s.boxShadow};
              }""")
              await control.hover()
              hover_state = await control.evaluate("""el => {
                const s = getComputedStyle(el);
                return {background:s.backgroundColor, transform:s.transform, boxShadow:s.boxShadow};
              }""")
              box = await control.bounding_box()
              active_state = None
              if box:
                  await page.mouse.move(box["x"] + box["width"]/2, box["y"] + box["height"]/2)
                  await page.mouse.down()
                  await page.wait_for_timeout(220)
                  active_state = await control.evaluate("""el => {
                    const s = getComputedStyle(el);
                    return {background:s.backgroundColor, transform:s.transform, boxShadow:s.boxShadow};
                  }""")
                  await page.mouse.up()

              target_failures = await page.locator("button, select, input, .header-text-link").evaluate_all("""els => els.flatMap(el => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                if (s.display === 'none' || s.visibility === 'hidden' || r.width === 0 || r.height === 0) return [];
                if (r.width >= 44 && r.height >= 44) return [];
                return [{tag:el.tagName, text:(el.textContent||'').trim(), width:r.width, height:r.height}];
              })""")

              disabled_state = await page.locator("#effective-sort").evaluate("""el => ({
                disabled: el.disabled,
                cursor: getComputedStyle(el).cursor,
                background: getComputedStyle(el).backgroundColor,
                color: getComputedStyle(el).color
              })""")

              # State checks must not contaminate human-review screenshots.
              await page.mouse.move(1, 1)
              await page.evaluate("document.activeElement && document.activeElement.blur()")
              await page.wait_for_timeout(120)
              await page.evaluate("() => { document.documentElement.style.scrollBehavior = 'auto'; window.scrollTo(0, 0); }")
              await page.wait_for_timeout(120)
              map_path = OUT / f"decision-map-{width}.png"
              await page.screenshot(path=str(map_path), full_page=True)
              map_metrics = await metrics(page, width, "map")

              await page.locator("#to-calendar").click()
              await page.wait_for_timeout(450)
              calendar_heading_clear = await page.evaluate("""() => {
                const header = document.querySelector('.decision-header').getBoundingClientRect();
                const heading = document.querySelector('[data-panel="2"] h2').getBoundingClientRect();
                return heading.top >= header.bottom - 2;
              }""")
              await page.locator('[data-date="2026-10-14"]').click()
              await page.evaluate("() => { document.documentElement.style.scrollBehavior = 'auto'; window.scrollTo(0, 0); }")
              await page.wait_for_timeout(120)
              calendar_path = OUT / f"decision-calendar-{width}.png"
              await page.screenshot(path=str(calendar_path), full_page=True)
              calendar_metrics = await metrics(page, width, "calendar")

              await page.locator("#to-compare").click()
              await page.wait_for_timeout(450)
              estimator_panel = page.locator(".assumed-price-panel")
              if not await estimator_panel.evaluate("el => el.open"):
                  await estimator_panel.locator("summary").click()
              await page.locator("#assumed-price").fill("50000")
              await page.wait_for_timeout(120)
              if await estimator_panel.evaluate("el => el.open"):
                  await estimator_panel.locator("summary").click()
              compare_heading_clear = await page.evaluate("""() => {
                const header = document.querySelector('.decision-header').getBoundingClientRect();
                const heading = document.querySelector('[data-panel="3"] h2').getBoundingClientRect();
                return heading.top >= header.bottom - 2;
              }""")
              await page.evaluate("() => { document.documentElement.style.scrollBehavior = 'auto'; window.scrollTo(0, 0); }")
              await page.wait_for_timeout(120)
              comparison_path = OUT / f"decision-compare-{width}.png"
              await page.screenshot(path=str(comparison_path), full_page=True)
              compare_metrics = await metrics(page, width, "compare")
              estimate_texts = [text.strip() for text in await page.locator(".estimate-cell").all_inner_texts()]
              share_url = page.url

              await page.locator(".offer-detail-button").first.click()
              await page.wait_for_timeout(180)
              dialog_open = await page.locator("#offer-dialog").evaluate("el => el.open")
              dialog_box = await page.locator("#offer-dialog").bounding_box()
              booking_href = await page.locator('.dialog-links a').nth(1).get_attribute("href")
              details_path = OUT / f"decision-details-{width}.png"
              await page.screenshot(path=str(details_path), full_page=False)
              await page.locator("#dialog-close").click()

              result = {
                  "viewport": [width, height],
                  "http_status": resp.status if resp else None,
                  "title": title,
                  "h1": h1,
                  "data_notice": data_notice,
                  "estimator_contract": estimator_contract,
                  "font_status": font_status,
                  "font_checks": font_checks,
                  "image_failures": image_failures,
                  "page_errors": page_errors,
                  "console_errors": console_errors,
                  "persisted": persisted,
                  "target_failures": target_failures,
                  "focus_visible": focus_visible,
                  "base_state": base_state,
                  "hover_state": hover_state,
                  "active_state": active_state,
                  "disabled_state": disabled_state,
                  "dialog_open": dialog_open,
                  "dialog_box": dialog_box,
                  "estimate_texts": estimate_texts,
                  "share_url": share_url,
                  "booking_href": booking_href,
                  "calendar_heading_clear": calendar_heading_clear,
                  "compare_heading_clear": compare_heading_clear,
                  "screenshots": {
                      "home": str(initial_path),
                      "map": str(map_path),
                      "calendar": str(calendar_path),
                      "compare": str(comparison_path),
                      "details": str(details_path),
                  },
                  "stage_metrics": [map_metrics, calendar_metrics, compare_metrics],
              }
              await page.close()
              return result

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  entry_routes = await check_entry_routes(browser)
                  results = []
                  for width, height in VIEWPORTS:
                      results.append(await capture_width(browser, width, height))

                  reflow = {}
                  page = await browser.new_page(viewport={"width": 320, "height": 812}, locale="ja-JP", timezone_id="Asia/Tokyo")
                  await page.goto(URL, wait_until="networkidle")
                  reflow["width320"] = {
                      "scrollWidth": await page.evaluate("document.documentElement.scrollWidth"),
                      "clientWidth": await page.evaluate("document.documentElement.clientWidth"),
                  }
                  await page.close()

                  page = await browser.new_page(viewport={"width": 375, "height": 812}, locale="ja-JP", timezone_id="Asia/Tokyo")
                  await page.goto(URL, wait_until="networkidle")
                  await page.add_style_tag(content="html { font-size: 200% !important; }")
                  await page.wait_for_timeout(100)
                  reflow["text200"] = {
                      "scrollWidth": await page.evaluate("document.documentElement.scrollWidth"),
                      "clientWidth": await page.evaluate("document.documentElement.clientWidth"),
                  }
                  await page.close()
                  await browser.close()

              (OUT / "qa.json").write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding="utf-8")
              (OUT / "entry-routes.json").write_text(json.dumps(entry_routes, ensure_ascii=False, indent=2), encoding="utf-8")
              (OUT / "reflow.json").write_text(json.dumps(reflow, ensure_ascii=False, indent=2), encoding="utf-8")

              failures = []
              for route in entry_routes:
                  if route["visible_panel"] != route["expected_panel"]:
                      failures.append(f"entry {route['query']}: panel {route['visible_panel']} != {route['expected_panel']}")
                  if route["destination"] != route["expected_destination"]:
                      failures.append(f"entry {route['query']}: destination {route['destination']} != {route['expected_destination']}")
                  if route["date"] != route["expected_date"]:
                      failures.append(f"entry {route['query']}: date {route['date']} != {route['expected_date']}")
              for r in results:
                  v = r["viewport"]
                  if r["http_status"] != 200:
                      failures.append(f"{v}: http {r['http_status']}")
                  normalized_h1 = "".join(r["h1"].split())
                  if normalized_h1 != "どこへ行く？":
                      failures.append(f"{v}: identity h1 mismatch {r['h1']}")
                  if "旅行のお得を決める" not in r["title"]:
                      failures.append(f"{v}: identity title mismatch {r['title']}")
                  if "実価格・在庫は未連携" not in r["data_notice"]:
                      failures.append(f"{v}: honest Level 1 boundary missing")
                  estimator_expected = {
                      "hook": True,
                      "capped": "約3,000円",
                      "below": "最低利用額未満",
                      "fixed": "約5,000円",
                      "badCurrency": "計算条件が未確認",
                      "missingRounding": "計算条件が未確認",
                      "points": "未算出（ポイント型）",
                  }
                  if r["estimator_contract"] != estimator_expected:
                      failures.append(f"{v}: estimator contract {r['estimator_contract']}")
                  if r["font_status"] != "loaded" or not r["font_checks"]["noto"] or not r["font_checks"]["inter"]:
                      failures.append(f"{v}: web font {r['font_checks']}")
                  if "Noto Sans JP" not in r["font_checks"]["h1Family"] or "Noto Sans JP" not in r["font_checks"]["footerFamily"]:
                      failures.append(f"{v}: computed font family {r['font_checks']}")
                  if r["image_failures"]:
                      failures.append(f"{v}: broken visual images {r['image_failures']}")
                  if r["page_errors"] or r["console_errors"]:
                      failures.append(f"{v}: browser errors page={r['page_errors']} console={r['console_errors']}")
                  if r["persisted"] != {"destination": "kanto", "month": "2026-11", "adults": "大人3人"}:
                      failures.append(f"{v}: form persistence {r['persisted']}")
                  if r["target_failures"]:
                      failures.append(f"{v}: target size {r['target_failures']}")
                  if not r["focus_visible"]:
                      failures.append(f"{v}: focus-visible")
                  if r["hover_state"] == r["base_state"]:
                      failures.append(f"{v}: hover state not distinct")
                  if not r["active_state"] or r["active_state"] == r["hover_state"]:
                      failures.append(f"{v}: active state not distinct")
                  if not r["disabled_state"]["disabled"] or r["disabled_state"]["cursor"] != "not-allowed":
                      failures.append(f"{v}: disabled state")
                  if not r["dialog_open"] or not r["dialog_box"]:
                      failures.append(f"{v}: details dialog")
                  if not r["estimate_texts"] or any("未算出（ポイント型）" not in text for text in r["estimate_texts"]):
                      failures.append(f"{v}: reward points were not safely excluded from discount estimate: {r['estimate_texts']}")
                  if "destination=kanto" not in r["share_url"] or "date=2026-10-14" not in r["share_url"] or "price=50000" not in r["share_url"]:
                      failures.append(f"{v}: share URL missing state {r['share_url']}")
                  if not (r["booking_href"] or "").startswith("https://travel.yahoo.co.jp/"):
                      failures.append(f"{v}: official booking destination missing {r['booking_href']}")
                  if not r["calendar_heading_clear"] or not r["compare_heading_clear"]:
                      failures.append(f"{v}: sticky header overlaps stage heading")
                  if v[0] <= 390 and r["dialog_box"] and r["dialog_box"]["width"] < v[0] - 2:
                      failures.append(f"{v}: mobile bottom sheet width {r['dialog_box']['width']}")
                  panels = [m["visible_panel"] for m in r["stage_metrics"]]
                  if panels != ["1", "2", "3"]:
                      failures.append(f"{v}: stage flow {panels}")
                  for m in r["stage_metrics"]:
                      if m["overflow"]:
                          failures.append(f"{v} stage {m['stage']}: horizontal overflow {m['scrollWidth']}>{m['clientWidth']}")
              if reflow["width320"]["scrollWidth"] > reflow["width320"]["clientWidth"]:
                  failures.append(f"320px reflow overflow {reflow['width320']}")
              if reflow["text200"]["scrollWidth"] > reflow["text200"]["clientWidth"]:
                  failures.append(f"200% text resize overflow {reflow['text200']}")
              if failures:
                  raise SystemExit("\n".join(failures))
              print("decision UI mechanical QA: PASS")

          asyncio.run(main())
          PY
          python /tmp/capture_decision.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-ui-visual-qa
          path: artifacts/decision-ui/
          if-no-files-found: error
