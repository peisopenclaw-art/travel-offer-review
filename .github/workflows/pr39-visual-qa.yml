name: pr39-visual-qa
# temporary pre-human visual proof; remove after human approval

on:
  pull_request:
    paths:
      - "index.html"
      - ".github/workflows/pr39-visual-qa.yml"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install chromium
      - name: Start isolated static preview
        run: |
          python3 -m http.server 4173 > /tmp/pr39-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/pr39-http.log
          exit 1
      - name: Mechanical QA and screenshots
        run: |
          mkdir -p artifacts/pr39
          cat > /tmp/capture.py <<'PY'
          import asyncio, json
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT = Path("artifacts/pr39")
          URL = "http://127.0.0.1:4173/"
          viewports = [(1440, 1100), (390, 844), (375, 812)]

          async def main():
              results = []
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  for width, height in viewports:
                      page_errors, console_errors, outbound_a8 = [], [], []
                      page = await browser.new_page(viewport={"width": width, "height": height})
                      page.on("pageerror", lambda exc: page_errors.append(str(exc)))
                      page.on("console", lambda msg: console_errors.append(msg.text) if msg.type == "error" else None)
                      page.on("request", lambda req: outbound_a8.append(req.url) if req.url.startswith("https://px.a8.net/") else None)
                      resp = await page.goto(URL, wait_until="networkidle")
                      await page.evaluate("document.fonts.ready")
                      title = await page.title()
                      h1 = (await page.locator("h1").inner_text()).strip()
                      scroll_w = await page.evaluate("document.documentElement.scrollWidth")
                      client_w = await page.evaluate("document.documentElement.clientWidth")
                      font_status = await page.evaluate("document.fonts.status")
                      font_checks = await page.evaluate("""async () => {
                        await document.fonts.load('16px "BIZ UDPGothic"', '旅行');
                        await document.fonts.load('16px "Shippori Mincho"', '旅行');
                        await document.fonts.load('16px "Zen Kaku Gothic New"', '旅行');
                        return {
                          biz: document.fonts.check('16px "BIZ UDPGothic"', '旅行'),
                          shippori: document.fonts.check('16px "Shippori Mincho"', '旅行'),
                          zen: document.fonts.check('16px "Zen Kaku Gothic New"', '旅行')
                        };
                      }""")
                      headings = await page.locator("h1,h2,h3").all_inner_texts()
                      statuses_now = await page.locator(".secondary-offers .status").all_inner_texts()
                      status_rollover = await page.evaluate("""() => {
                        updateOfferStatuses(Date.parse('2026-10-01T12:01:00+09:00'));
                        return Array.from(document.querySelectorAll('.secondary-offers .status')).map(el => el.textContent.trim());
                      }""")
                      await page.evaluate("updateOfferStatuses(Date.now())")
                      target_failures = await page.locator("a").evaluate_all("""els => els.filter(el => {
                        const r = el.getBoundingClientRect();
                        const s = getComputedStyle(el);
                        if (s.display === 'none' || s.visibility === 'hidden' || r.width === 0 || r.height === 0) return false;
                        return r.width < 24 || r.height < 24;
                      }).map(el => ({text:(el.textContent||'').trim(), width:el.getBoundingClientRect().width, height:el.getBoundingClientRect().height}))""")
                      control = page.locator(".secondary-offers .a8-ad-material a").last
                      await control.focus()
                      focus_visible = await control.evaluate("el => el.matches(':focus-visible')")
                      await control.hover()
                      hover_state = await control.evaluate("""el => {
                        const s = getComputedStyle(el);
                        return {background:s.backgroundColor, transform:s.transform, boxShadow:s.boxShadow};
                      }""")
                      box = await control.bounding_box()
                      active_state = None
                      if box:
                          await page.mouse.move(box["x"] + box["width"]/2, box["y"] + box["height"]/2)
                          await page.mouse.down()
                          await page.wait_for_timeout(250)
                          active_state = await control.evaluate("""el => {
                            const s = getComputedStyle(el);
                            return {background:s.backgroundColor, transform:s.transform, boxShadow:s.boxShadow};
                          }""")
                          await page.mouse.move(1, 1)
                          await page.mouse.up()
                          await page.wait_for_timeout(100)
                      shot = OUT / f"pr39-{width}.png"
                      await page.screenshot(path=str(shot), full_page=True)
                      results.append({
                        "viewport": [width, height],
                        "http_status": resp.status if resp else None,
                        "title": title,
                        "h1": h1,
                        "headings": headings,
                        "statuses_now": statuses_now,
                        "statuses_at_2026_10_01_1201": status_rollover,
                        "scrollWidth": scroll_w,
                        "clientWidth": client_w,
                        "overflow": scroll_w > client_w,
                        "font_status": font_status,
                        "font_checks": font_checks,
                        "page_errors": page_errors,
                        "console_errors": console_errors,
                        "target_failures": target_failures,
                        "focus_visible": focus_visible,
                        "hover_state": hover_state,
                        "active_state": active_state,
                        "a8_anchor_navigation_requests": outbound_a8,
                        "screenshot": str(shot),
                      })
                      await page.close()
                  await browser.close()
              (OUT / "qa.json").write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding="utf-8")
              failures = []
              for r in results:
                  if r["http_status"] != 200: failures.append(f'{r["viewport"]}: http {r["http_status"]}')
                  if "日本の、いい旅を見つける。" not in "".join(r["h1"].split()): failures.append(f'{r["viewport"]}: identity h1')
                  if r["overflow"]: failures.append(f'{r["viewport"]}: horizontal overflow')
                  if r["font_status"] != "loaded" or not all(r["font_checks"].values()): failures.append(f'{r["viewport"]}: web font')
                  if r["page_errors"] or r["console_errors"]: failures.append(f'{r["viewport"]}: browser errors')
                  if r["statuses_now"] != ["掲載中", "開始予定"]: failures.append(f'{r["viewport"]}: current status mismatch {r["statuses_now"]}')
                  if r["statuses_at_2026_10_01_1201"] != ["掲載した受付期間は終了", "掲載中"]: failures.append(f'{r["viewport"]}: rollover status mismatch {r["statuses_at_2026_10_01_1201"]}')
                  if r["target_failures"]: failures.append(f'{r["viewport"]}: touch target failures {r["target_failures"]}')
                  if not r["focus_visible"]: failures.append(f'{r["viewport"]}: focus-visible')
                  if not r["active_state"] or r["active_state"] == r["hover_state"]: failures.append(f'{r["viewport"]}: active state not distinct from hover')
                  if r["a8_anchor_navigation_requests"]: failures.append(f'{r["viewport"]}: A8 anchor navigation occurred')
              if failures:
                  raise SystemExit("\n".join(failures))
              print("PR39 visual mechanical QA: PASS")
          asyncio.run(main())
          PY
          python /tmp/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr39-visual-qa
          path: artifacts/pr39/
          if-no-files-found: error
