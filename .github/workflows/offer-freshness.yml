name: offer-freshness

on:
  pull_request:
    paths:
      - "index.html"
      - "scripts/check_offer_freshness.py"
      - ".github/workflows/offer-freshness.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/check_offer_freshness.py"
      - ".github/workflows/offer-freshness.yml"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_offer_freshness.py
