name: temp-ui-qa-chatgpt

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        run: python3 scripts/check_site.py

      - name: Install browser tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run local preview
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/travel-ui-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/travel-ui-http.log
          exit 1

      - name: Capture and inspect layout
        run: |
          mkdir -p qa-artifact
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const widths = [1440, 390, 375, 320];
          const results = [];
          const browser = await chromium.launch({headless: true});

          for (const width of widths) {
            const page = await browser.newPage({ viewport: { width, height: width === 1440 ? 1000 : 844 }, deviceScaleFactor: 1 });
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => pageErrors.push(String(err)));

            await page.goto('http://127.0.0.1:8000/', { waitUntil: 'networkidle' });
            await page.evaluate(async () => { if (document.fonts?.ready) await document.fonts.ready; });
            await page.waitForTimeout(1200);

            const data = await page.evaluate(() => {
              const exactA8Href = 'https://px.a8.net/svt/ejp?a8mat=4B3UZ5+38P0W2+4ZCO+60WN6';
              const a8Links = [...document.querySelectorAll('.a8-ad-material a')];
              const selectors = 'h1,h2,h3,.a8-ad-material a,.secondary-cta,.source-link';
              const elements = [...document.querySelectorAll(selectors)];

              function visualLines(el) {
                const chars = [];
                const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
                while (walker.nextNode()) {
                  const node = walker.currentNode;
                  for (let i = 0; i < node.textContent.length; i++) {
                    const ch = node.textContent[i];
                    if (/\s/.test(ch)) continue;
                    const r = document.createRange();
                    r.setStart(node, i);
                    r.setEnd(node, i + 1);
                    const rect = r.getBoundingClientRect();
                    if (rect.width < 0.5 || rect.height < 0.5) continue;
                    chars.push({ch, x:rect.x, y:rect.y});
                  }
                }
                chars.sort((a,b) => Math.abs(a.y-b.y) > 3 ? a.y-b.y : a.x-b.x);
                const lines = [];
                for (const item of chars) {
                  let line = lines.find(l => Math.abs(l.y - item.y) <= 3);
                  if (!line) { line = {y:item.y, chars:[]}; lines.push(line); }
                  line.chars.push(item);
                }
                return lines.sort((a,b)=>a.y-b.y).map(l => l.chars.sort((a,b)=>a.x-b.x).map(x=>x.ch).join(''));
              }

              const items = elements.map(el => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return {
                  tag: el.tagName,
                  className: String(el.className),
                  text: el.textContent.trim().replace(/\s+/g,' '),
                  lines: visualLines(el),
                  box: {x:Math.round(r.x), y:Math.round(r.y), w:Math.round(r.width), h:Math.round(r.height)},
                  fontFamily: s.fontFamily,
                  fontSize: s.fontSize,
                  lineHeight: s.lineHeight,
                  href: el.tagName === 'A' ? el.getAttribute('href') : null
                };
              });

              return {
                title: document.title,
                heroTitle: document.querySelector('h1')?.textContent?.trim().replace(/\s+/g,' '),
                viewport: {w: innerWidth, h: innerHeight},
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                overflowX: document.documentElement.scrollWidth > document.documentElement.clientWidth,
                fonts: {
                  shippori: document.fonts.check('700 16px "Shippori Mincho"'),
                  zenKaku: document.fonts.check('700 16px "Zen Kaku Gothic New"'),
                  bizUdp: document.fonts.check('700 16px "BIZ UDPGothic"')
                },
                a8: {
                  count: a8Links.length,
                  exactText: a8Links.every(a => a.textContent.trim() === '【ヤフートラベル】'),
                  exactHref: a8Links.every(a => a.getAttribute('href') === exactA8Href),
                  hasTrackingPixel: [...document.querySelectorAll('.a8-ad-material > img')].every(img => img.width === 1 && img.height === 1)
                },
                items
              };
            });

            data.consoleErrors = consoleErrors.filter(x => !x.includes('Failed to load resource'));
            data.pageErrors = pageErrors;

            if ([1440,390,375].includes(width)) {
              await page.screenshot({ path: `qa-artifact/pr35-${width}.png`, fullPage: true });
            }

            await page.evaluate(() => document.addEventListener('click', e => e.preventDefault(), true));
            const firstA8 = page.locator('.a8-ad-material a').first();
            if (await firstA8.count()) {
              const normal = await firstA8.evaluate(el => {
                const s=getComputedStyle(el); return {background:s.backgroundColor,transform:s.transform,outline:s.outline};
              });
              await firstA8.hover();
              await page.waitForTimeout(250);
              const hover = await firstA8.evaluate(el => {
                const s=getComputedStyle(el); return {background:s.backgroundColor,transform:s.transform,outline:s.outline};
              });
              const box = await firstA8.boundingBox();
              if (box) {
                await page.mouse.move(box.x + box.width/2, box.y + box.height/2);
                await page.mouse.down();
                await page.waitForTimeout(250);
              }
              const active = await firstA8.evaluate(el => {
                const s=getComputedStyle(el); return {background:s.backgroundColor,transform:s.transform,outline:s.outline};
              });
              await page.mouse.up();
              data.a8States = {normal, hover, active};
            }

            await page.evaluate(() => document.activeElement?.blur?.());
            await page.keyboard.press('Tab');
            data.focusAfterTab = await page.evaluate(() => {
              const el = document.activeElement;
              const s = getComputedStyle(el);
              return {
                tag: el?.tagName,
                className: String(el?.className || ''),
                text: el?.textContent?.trim().replace(/\s+/g,' '),
                outlineStyle: s.outlineStyle,
                outlineWidth: s.outlineWidth,
                outlineColor: s.outlineColor
              };
            });

            const targetSizes = await page.evaluate(() => [...document.querySelectorAll('a[href],button')].map(el => {
              const r = el.getBoundingClientRect();
              return {text:(el.textContent||'').trim().replace(/\s+/g,' '), w:Math.round(r.width), h:Math.round(r.height)};
            }));
            data.targetSizes = targetSizes;
            data.targetSizeFailures = targetSizes.filter(x => x.w < 24 || x.h < 24);

            await page.evaluate(() => {
              document.documentElement.style.fontSize = '200%';
            });
            await page.waitForTimeout(100);
            data.text200 = await page.evaluate(() => ({
              overflowX: document.documentElement.scrollWidth > document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth
            }));
            await page.evaluate(() => {
              document.documentElement.style.fontSize = '';
              const style = document.createElement('style');
              style.id = 'qa-text-spacing';
              style.textContent = '*{line-height:1.5 !important;letter-spacing:.12em !important;word-spacing:.16em !important} p{margin-bottom:2em !important}';
              document.head.appendChild(style);
            });
            await page.waitForTimeout(100);
            data.textSpacing = await page.evaluate(() => ({
              overflowX: document.documentElement.scrollWidth > document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth
            }));

            results.push(data);
            await page.close();
          }

          await browser.close();
          fs.writeFileSync('qa-artifact/qa.json', JSON.stringify(results, null, 2));

          const fail = results.some(x =>
            x.title !== '旅行オファー比較 β' ||
            !String(x.heroTitle || '').includes('日本の、') ||
            x.overflowX ||
            !x.fonts.shippori ||
            !x.fonts.zenKaku ||
            !x.fonts.bizUdp ||
            x.pageErrors.length > 0 ||
            x.targetSizeFailures.length > 0 ||
            x.text200.overflowX ||
            x.textSpacing.overflowX ||
            x.a8.count !== 2 ||
            !x.a8.exactText ||
            !x.a8.exactHref ||
            !x.a8.hasTrackingPixel
          );
          if (fail) process.exitCode = 2;
          EOF
          node capture.mjs

      - name: Upload UI QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr35-ui-qa-chatgpt
          path: qa-artifact/
          if-no-files-found: error
          retention-days: 7
