name: editorial-campaign-qa
on:
  pull_request:
    paths:
      - "kyushu-recovery-discount.html"
      - "styles.css"
      - ".github/workflows/revenue-shelf-visual-qa.yml"
  workflow_dispatch:
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_site.py
