name: live-cloudflare-readback
# Production-only QA: no credentials, deploys, DB writes, or affiliate clicks.
on:
  pull_request:
    paths: [".github/workflows/live-cloudflare-readback.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm current 8776-equivalent map files and live sanitized DB feed
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          from urllib.request import Request, urlopen

          sys.path.insert(0, "scripts")
          from check_public_benefits import validate

          origin = "https://travel.tokuerabi.com"
          limit = 8 * 1024 * 1024

          def get(path):
              request = Request(origin + path, headers={
                  "Cache-Control": "no-cache",
                  "User-Agent": "TokuErabiProductionReadback/1.0",
              })
              with urlopen(request, timeout=20) as response:
                  if not response.geturl().startswith(origin + "/"):
                      raise RuntimeError("unexpected public redirect")
                  body = response.read(limit + 1)
                  if len(body) > limit:
                      raise RuntimeError("public asset exceeds size limit")
                  if response.status != 200:
                      raise RuntimeError(f"public HTTP {response.status} for {path}")
                  return body

          # The selected Tohoku / 2026-10 / map URL must serve the same
          # current homepage as the accepted static code, not a legacy site.
          print("HTML route fingerprint diagnostics:", flush=True)
          for route in [
              "/",
              "/index.html",
              "/?destination=tohoku&month=2026-10&view=map",
              "/?destination=tohoku&month=2026-10&view=date&calendar=1",
              "/index.html?release_proof=7672c3da",
              "/?release_proof=7672c3da",
          ]:
              try:
                  request = Request(origin + route, headers={"Cache-Control":"no-cache","User-Agent":"TokuErabiQA/1.0"})
                  with urlopen(request, timeout=20) as response:
                      body=response.read(limit+1)
                      print(f"route={route} bytes={len(body)} sha256={hashlib.sha256(body).hexdigest()[:12]} cache={response.headers.get('CF-Cache-Status')} etag={response.headers.get('ETag')} age={response.headers.get('Age')}",flush=True)
              except Exception as exc:
                  print(f"route={route} ERROR={type(exc).__name__}: {exc}",flush=True)

          failures = []
          for path, local in [
              ("/?destination=tohoku&month=2026-10&view=map", "index.html"),
              ("/decision-ui.js", "decision-ui.js"),
              ("/decision-ui.css", "decision-ui.css"),
              ("/styles.css", "styles.css"),
              ("/benefit-rules.js", "benefit-rules.js"),
              ("/search-geography.json", "search-geography.json"),
          ]:
              try:
                  remote = get(path)
                  local_hash = hashlib.sha256(Path(local).read_bytes()).hexdigest()[:12]
                  remote_hash = hashlib.sha256(remote).hexdigest()[:12]
                  ok = remote_hash == local_hash
                  print(f"{'PASS' if ok else 'STALE'} {local}: live={remote_hash} main={local_hash}", flush=True)
                  if not ok:
                      failures.append(f"stale asset: {local}")
              except Exception as exc:
                  print(f"FAIL {local}: {type(exc).__name__}: {exc}", flush=True)
                  failures.append(f"unreachable asset: {local}")

          # Do not stop after a stale UI asset: inspect freshness independently.
          try:
              data = json.loads(get("/decision-data.json"))
              print(f"PUBLIC FEED: schema={data.get('schema_version')} origin={data.get('data_origin')} as_of={data.get('as_of')} rows={data.get('record_count', len(data.get('offers', [])))}", flush=True)
              rows = validate(data, require_live=True)
              print(f"PASS sanitized PostgreSQL snapshot: {rows} records", flush=True)
          except Exception as exc:
              print(f"FAIL public DB freshness/contract: {type(exc).__name__}: {exc}", flush=True)
              failures.append("public DB contract/freshness")

          if failures:
              raise SystemExit(f"Production release gate failed: {', '.join(failures)}")
          PY
